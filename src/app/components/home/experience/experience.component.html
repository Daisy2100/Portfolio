<!-- 經歷／成果區域 -->
<section class="py-16 animate-fade-in-up">
  <div class="max-w-6xl mx-auto px-4">
    <div class="text-center mb-12">
      <h2 class="text-4xl font-bold text-white mb-4">{{ sectionTitle }}</h2>
      <p class="text-gray-300 text-lg">{{ sectionSubtitle }}</p>
    </div>
    <div class="space-y-4">
      <p-timeline [value]="workExperience" align="alternate">
        <ng-template #marker let-event>
          <div class="w-12 h-12 bg-white rounded-full border-4 flex items-center justify-center shadow-lg"
            [style.border-color]="event.color">
            <i [class]="event.icon" [style.color]="event.color" class="text-xl"></i>
          </div>
        </ng-template>
        <ng-template #content let-event>
          <p-card class="mb-4 shadow-lg bg-white">
            <ng-template #header>
              <div class="bg-gradient-to-r to-indigo-50 p-4 flex justify-between items-center border-b">
                <div class="text-md font-semibold text-blue-600">{{ event.period }}</div>
                <p-tag severity="info" [value]="event.duration" [rounded]="true" />
              </div>
            </ng-template>
            <div class="text-left p-6">
              <h3 class="text-2xl font-bold text-blue-600 mb-2">{{ event.title }}</h3>
              <h4 class="text-lg font-medium text-gray-800 mb-4">{{ event.company }}</h4>

              <div class="mb-4">
                <h5 class="text-base font-semibold text-amber-600 mb-2">【工作內容】</h5>
                <ul class="list-disc pl-6 space-y-1">
                  @for (responsibility of event.responsibilities; track responsibility) {
                    <li class="text-gray-700">{{ responsibility }}</li>
                  }
                </ul>
              </div>

              <div class="mt-3 mb-3">
                <div class="flex flex-wrap gap-2">
                  @for (tag of event.tags; track tag) {
                    <span class="inline-block px-3 py-1 text-sm bg-blue-100 text-blue-800 rounded-full font-medium">
                      {{ tag }}
                    </span>
                  }
                </div>
              </div>

              @if (event.detailRoute) {
                <div class="mt-4 pt-4 border-t border-gray-200">
                  <p-button
                    [label]="'查看 ' + event.company + ' 專案詳情'"
                    icon="pi pi-external-link"
                    severity="info"
                    size="small"
                    [outlined]="true"
                    (onClick)="navigateToDetail(event.detailRoute)"
                    class="w-full">
                  </p-button>
                </div>
              }
            </div>
          </p-card>
        </ng-template>
      </p-timeline>
    </div>
  </div>
</section>
